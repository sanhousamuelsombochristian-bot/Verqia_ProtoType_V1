</x-dc>

: { bg: '#1C1C1C', bg2: '#161616', card: '#262626', card2: '#303030', panel: '#202020', border: '#3A3A3A', line: '#2E2E2E', text: '#F2F2F0', heading: '#FFFFFF', soft: '#D6D6D4', muted2: '#BDBDBB', muted: '#9A9A9A', accent: '#97F201', a12: 'rgba(151,242,1,0.12)', aBorder: '#97F201', red: '#FF6B5B', redText: '#FF8A7A', redBg: 'rgba(255,107,91,0.10)', amber: '#F2B84B', amberText: '#F2B84B', amberBg: 'rgba(242,184,75,0.10)', mid: '#9A9A9A', low: '#4A4A4A', area: 'rgba(242,242,240,0.06)', histLine: '#F2F2F0', segOn: '#3A3A3A', segOnText: '#FFFFFF', rowHi: 'rgba(151,242,1,0.06)', knob: '#1C1C1C', off: '#4A4A4A', tile: 'transparent', input: '#262626' };
const s = this.state || {};
