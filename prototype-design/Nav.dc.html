<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Barre de navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
:focus-visible{outline:3px solid #97F201;outline-offset:2px;border-radius:6px}.vq-skip{position:absolute;left:-9999px;top:12px;z-index:50}.vq-skip:focus{left:16px;background:#97F201;color:#1C1C1C;padding:10px 14px;border-radius:8px;font-weight:800;text-decoration:none}
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 80px; box-sizing: border-box; padding: 0 64px; display: flex; align-items: center; justify-content: space-between; background: {{ t.bg }}; border-bottom: 1px solid {{ t.line }}; font-family: 'Inter', Arial, sans-serif; color: {{ t.text }}">
<a href="{{ l.accueil }}" style="display: flex; align-items: center; gap: 12px; text-decoration: none"><span style="width: 40px; height: 40px; border-radius: 10px; background: {{ t.tile }}; display: flex; align-items: center; justify-content: center"><img src="/_blob/fdc9f9300e6a64d64f0e2a2958a10be3" alt="" style="width: 32px; height: 29px; object-fit: contain"></span><span style="font-size: 18px; font-weight: 800; letter-spacing: 0.5px; color: {{ t.heading }}">VERQIA <span style="font-weight: 400; color: {{ t.accent }}">PILOT</span></span></a>
<nav aria-label="Navigation principale" style="display: flex; gap: 40px; font-size: 15px; font-weight: 500">
<a href="{{ l.accueil }}" style="color: {{ cAccueil }}; text-decoration: none">Accueil</a>
<a href="{{ l.entreprise }}" style="color: {{ cEntreprise }}; text-decoration: none">Entreprise</a>
<a href="{{ l.accueil }}" style="color: {{ t.text }}; text-decoration: none">Fonctionnalités</a>
<a href="{{ l.tarifs }}" style="color: {{ cTarifs }}; text-decoration: none">Tarifs</a>
</nav>
<div style="display: flex; gap: 12px; align-items: center">
<a href="{{ other }}" aria-label="{{ otherLabel }}" style="height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid {{ t.border }}; border-radius: 10px; color: {{ t.text }}; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></svg>{{ otherLabel }}</a>
<a href="{{ l.connexion }}" style="height: 44px; padding: 0 20px; display: inline-flex; align-items: center; border: 1.5px solid {{ t.border }}; border-radius: 10px; color: {{ t.text }}; font-size: 15px; font-weight: 600; text-decoration: none">Connexion</a>
<a href="{{ l.inscription }}" style="height: 44px; padding: 0 20px; display: inline-flex; align-items: center; border-radius: 10px; background: {{ t.fill }}; color: {{ t.onFill }}; font-size: 15px; font-weight: 700; text-decoration: none">Inscription</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["accueil","entreprise","tarifs"],"default":"accueil"},"mode":{"editor":"enum","options":["sombre","clair"],"default":"sombre"},"$preview":{"width":1440,"height":80}}'>
class Component extends DCLogic {
theme() {
const C = this.props.mode === 'clair';
const t = C ? { bg: '#FFFFFF', bg2: '#F5F5F3', card: '#F7F7F5', card2: '#EDEDEA', border: '#DDDDD8', line: '#E9E9E5', text: '#2A2A2A', heading: '#1C1C1C', soft: '#333333', muted2: '#4A4A4A', muted: '#666666', accent: '#3E6B00', fill: '#97F201', onFill: '#1C1C1C', tile: '#1C1C1C' }
: { bg: '#1C1C1C', bg2: '#161616', card: '#262626', card2: '#303030', border: '#3A3A3A', line: '#2E2E2E', text: '#F2F2F0', heading: '#FFFFFF', soft: '#D6D6D4', muted2: '#BDBDBB', muted: '#9A9A9A', accent: '#97F201', fill: '#97F201', onFill: '#1C1C1C', tile: 'transparent' };
const s = C ? 'Clair' : '';
const l = { accueil: C ? 'MainClair.dc.html' : 'Main.dc.html', entreprise: 'Entreprise' + s + '.dc.html', tarifs: 'Tarifs' + s + '.dc.html', connexion: 'Connexion' + s + '.dc.html', inscription: 'Inscription' + s + '.dc.html' };
return { C: C, t: t, l: l };
}
renderVals() {
const th = this.theme();
const a = this.props.active || 'accueil';
const base = { accueil: 'Main', entreprise: 'Entreprise', tarifs: 'Tarifs' }[a] || 'Main';
return {
t: th.t, l: th.l,
cAccueil: a === 'accueil' ? th.t.accent : th.t.text,
cEntreprise: a === 'entreprise' ? th.t.accent : th.t.text,
cTarifs: a === 'tarifs' ? th.t.accent : th.t.text,
other: th.C ? base + '.dc.html' : base + 'Clair.dc.html',
otherLabel: th.C ? 'Mode sombre' : 'Mode clair'
};
}
}
</script>
</body>
</html>
