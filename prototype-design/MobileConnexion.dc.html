</div>

<div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.6px; color: {{ t.heading }}">Connexion</h1><p style="margin: 0; font-size: 15px; color: {{ t.muted }}">Accédez à votre espace VERQIA PILOT.</p></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="m-email" style="font-size: 13.5px; font-weight: 600; color: {{ t.soft }}">E-mail professionnel</label><input id="m-email" type="email" placeholder="vous@entreprise.ci" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1.5px solid {{ t.border }}; background: {{ t.input }}; color: {{ t.heading }}; font-family: inherit; font-size: 15px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="m-mdp" style="font-size: 13.5px; font-weight: 600; color: {{ t.soft }}">Mot de passe</label><input id="m-mdp" type="password" placeholder="••••••••" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1.5px solid {{ t.border }}; background: {{ t.input }}; color: {{ t.heading }}; font-family: inherit; font-size: 15px"></div>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 13.5px"><label style="display: flex; align-items: center; gap: 8px; color: {{ t.muted2 }}"><input type="checkbox" style="flex-shrink: 0; width: 18px; height: 18px; accent-color: #97F201">Se souvenir de moi</label><a href="{{ l.connexion }}" style="color: {{ t.accent }}; text-decoration: none; font-weight: 600">Mot de passe oublié ?</a></div>
<a href="{{ l.app }}" style="height: 54px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #97F201; color: #1C1C1C; font-size: 16px; font-weight: 800; text-decoration: none">Se connecter</a>
<div style="font-size: 14.5px; color: {{ t.muted2 }}; text-align: center">Pas encore de compte ? <a href="{{ l.inscription }}" style="color: {{ t.accent }}; font-weight: 700; text-decoration: none">Créer un compte</a></div>
<a href="{{ l.accueil }}" style="font-size: 13.5px; color: {{ t.muted }}; text-decoration: none; text-align: center">← Retour au site</a>
</form>

</div>
</x-dc>
